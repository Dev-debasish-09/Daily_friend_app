<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F1FA">
  <title>Settings · ASCEND</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">

  <script src="shared.js"></script>
  <script src="settings.js" defer></script>

  <!-- Styles only Settings needs -->
  <style>
    .quote-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quote-list:empty { display: none; }

    .quote-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 6px 10px 16px;
      background: var(--tile-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-tile);
    }
    .quote-item__text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .quote-item .btn { flex: none; padding: 12px 14px; }
    .quote-item .btn.is-confirming { color: var(--danger-text); }
  </style>
</head>

<body data-page="settings">
  <main class="page" id="main">

    <header class="stack rise-in">
      <p class="eyebrow">More</p>
      <h1>Settings</h1>
      <p class="muted">Change your details anytime.</p>
    </header>

    <!-- Profile -->
    <section class="card" aria-labelledby="h-profile">
      <form class="stack-lg" id="profile-form" novalidate>
        <h2 id="h-profile">Your profile</h2>

        <div class="field">
          <label class="label" for="name">Your name</label>
          <input class="input" id="name" name="name" type="text" autocomplete="name"
                 autocapitalize="words" maxlength="40" required>
        </div>

        <div class="field">
          <label class="label" for="dob">Date of birth</label>
          <input class="input" id="dob" name="dob" type="date" min="1940-01-01" required>
        </div>

        <div class="field">
          <label class="label" for="exam">ISS exam date</label>
          <input class="input" id="exam" name="exam" type="date" aria-describedby="exam-hint" required>
          <p class="hint" id="exam-hint"></p>
        </div>

        <div class="field">
          <label class="label" for="limit">Monthly food delivery limit</label>
          <div class="input-group">
            <span class="input-group__prefix" aria-hidden="true">₹</span>
            <input class="input" id="limit" name="limit" type="text" inputmode="numeric"
                   autocomplete="off" required>
          </div>
        </div>

        <button class="btn btn--primary btn--block" type="submit">Save changes</button>
      </form>
    </section>

    <!-- Your own quotes -->
    <section class="card stack-lg" aria-labelledby="h-quotes">
      <div class="stack">
        <h2 id="h-quotes">Your quotes</h2>
        <p class="muted">Your own lines show on Today about one day in three.</p>
      </div>

      <form class="stack" id="quote-form" novalidate>
        <div class="field">
          <label class="label" for="quote-input">New quote</label>
          <textarea class="textarea" id="quote-input" maxlength="200"
            placeholder="e.g. The ISS rank is built in the quiet hours." aria-describedby="quote-count"></textarea>
          <p class="hint" id="quote-count">0 of 200 characters</p>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Add quote</button>
      </form>

      <ul class="quote-list" id="quote-list" aria-label="Your saved quotes"></ul>
    </section>

    <!-- Appearance -->
    <section class="card stack" aria-labelledby="h-theme">
      <h2 id="h-theme">Theme</h2>
      <p class="muted">Changes right away.</p>
      <div class="segmented" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="dawn" aria-pressed="false">Dawn</button>
        <button type="button" data-theme-choice="night" aria-pressed="false">Night</button>
      </div>
    </section>

  </main>
</body>
</html>
