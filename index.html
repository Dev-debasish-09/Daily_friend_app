<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F1FA">
  <title>Today · ASCEND</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">

  <script src="shared.js"></script>
  <script src="index.js" defer></script>
</head>

<!-- PLACEHOLDER: the real Today page (mountain, sunrise, targets) comes in a later step -->
<body data-page="today">
  <main class="page" id="main">

    <header class="stack rise-in">
      <p class="eyebrow" id="today-date"></p>
      <h1 id="hello">Hello</h1>
    </header>

    <section class="grid-2" aria-label="Your markers">
      <div class="tile">
        <span class="tile__label">ISS exam</span>
        <span class="tile__value" id="exam-days">–</span>
        <span class="tile__note" id="exam-date"></span>
      </div>
      <div class="tile">
        <span class="tile__label">Food delivery limit</span>
        <span class="tile__value" id="food-limit">–</span>
        <span class="tile__note">per month</span>
      </div>
    </section>

    <p class="muted">Your full Today page is coming next.</p>

  </main>
</body>
</html>
